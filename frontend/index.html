<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri-ID | Santé CI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">

    <!-- Third Party Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js" type="application/javascript"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <!-- Background Elements -->
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>
    <div class="glow-bg glow-3"></div>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="logo-container">
            <div class="logo-icon">
                <i class='bx bx-plus-medical'></i>
            </div>
            <span class="logo-text">Nutri-ID</span>
        </div>

        <ul class="nav-links">
            <li><a href="#home" class="active" data-route="home"><i class='bx bxs-home-smile'></i> <span
                        data-i18n="nav.home">Accueil</span></a></li>
            <li><a href="#dashboard" data-route="dashboard"><i class='bx bxs-dashboard'></i> <span
                        data-i18n="nav.dashboard">Tableau de bord</span></a></li>
            <li><a href="#health-id" data-route="health-id"><i class='bx bx-id-card'></i> <span
                        data-i18n="nav.health_id">ID Santé</span></a></li>
            <li><a href="#records" data-route="records"><i class='bx bx-folder-open'></i> <span
                        data-i18n="nav.records">Dossiers</span></a></li>
            <li><a href="#vaccines" data-route="vaccines"><i class='bx bxs-shield-plus'></i> <span
                        data-i18n="nav.vaccines">Vaccins</span></a></li>
            <li><a href="#find-care" data-route="find-care"><i class='bx bxs-map-pin'></i> <span
                        data-i18n="nav.find_care">Trouver un soin</span></a></li>
            <li><a href="#nutrition" data-route="nutrition"><i class='bx bxs-bowl-hot'></i> <span
                        data-i18n="nav.nutrition">Nutri-ID</span></a></li>
            <li><a href="#teleconsult" data-route="teleconsult"><i class='bx bxs-video'></i> <span
                        data-i18n="nav.teleconsult">Téléconsultation</span></a></li>
            <li><a href="#cmu" data-route="cmu"><i class='bx bxs-check-shield'></i> <span data-i18n="nav.cmu">Couverture
                        CMU</span></a></li>
            <li><a href="#settings" data-route="settings"><i class='bx bxs-cog'></i> <span
                        data-i18n="nav.settings">Paramètres</span></a></li>
        </ul>

        <div class="user-profile">
            <img src="https://ui-avatars.com/api/?name=Kouadio+A.&background=F77F00&color=fff" alt="Profile"
                class="avatar">
            <div class="user-info">
                <h4>Kouadio A.</h4>
                <p>NIP: 00129482</p>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle"><i class='bx bx-menu'></i></button>
            <div class="search-bar">
                <i class='bx bx-search'></i>
                <input type="text" placeholder="Rechercher..." data-i18n-placeholder="topbar.search">
            </div>

            <div class="topbar-actions">
                <div class="lang-selector">
                    <i class='bx bx-globe'></i>
                    <select id="language-select">
                        <option value="fr">Français</option>
                        <option value="dioula">Dioula</option>
                        <option value="baoule">Baoulé</option>
                        <option value="bete">Bété</option>
                        <option value="agni">Agni</option>
                    </select>
                </div>
                <button class="theme-toggle" id="theme-toggle"><i class='bx bx-sun'></i></button>
                <div class="notification">
                    <i class='bx bxs-bell'></i>
                    <span class="badge">3</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Page Container -->
        <div id="page-container" class="page-container">
            <!-- Pages will be injected securely here via JS -->
        </div>
    </main>

    <!-- Partial Templates (Injected dynamically) -->

    <!-- HOME TEMPLATE -->
    <template id="tpl-home">
        <div class="page hero-page animate-fade-in">
            <div class="hero-content">
                <div class="badge-pill mb-2">
                    <span class="dot"></span> <span data-i18n="home.live_status">Système National Sécurisé</span>
                </div>
                <h1 class="hero-title"><span class="gradient-text">Santé & Nutrition</span><br>Pour Toute la Côte
                    d'Ivoire</h1>
                <p class="hero-subtitle" data-i18n="home.subtitle">Votre identité de santé sécurisée par la blockchain,
                    accessible partout, à tout moment. Ministère de la Santé CI.</p>
                <div class="hero-actions">
                    <a href="#dashboard" class="btn btn-primary"><span data-i18n="home.btn_dashboard">Accéder au Tableau
                            de Bord</span> <i class='bx bx-right-arrow-alt'></i></a>
                    <a href="#health-id" class="btn btn-secondary"><span data-i18n="home.btn_id">Voir mon ID
                            Santé</span></a>
                </div>
            </div>
            <div class="stats-row mt-4">
                <div class="stat-card glass">
                    <i class='bx bx-user-check text-orange'></i>
                    <div class="stat-info">
                        <h3>2.4M</h3>
                        <p>Citoyens Connectés</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <i class='bx bx-buildings text-green'></i>
                    <div class="stat-info">
                        <h3>840+</h3>
                        <p>Centres de Santé</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <i class='bx bx-link-external text-white'></i>
                    <div class="stat-info">
                        <h3>100%</h3>
                        <p>Blockchain Sécurisée</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD TEMPLATE -->
    <template id="tpl-dashboard">
        <div class="page dashboard-page animate-fade-in">
            <div class="page-header">
                <div>
                    <h2 data-i18n="dashboard.title">Tableau de bord</h2>
                    <p class="text-muted" data-i18n="dashboard.subtitle">Aperçu de votre état de santé et assurance.</p>
                </div>
                <button class="btn btn-primary btn-sm"><i class='bx bx-plus'></i> <span
                        data-i18n="dashboard.new_record">Nouveau Document</span></button>
            </div>

            <div class="grid-layout">
                <div class="card glass span-2">
                    <div class="card-header">
                        <h3><i class='bx bx-activity'></i> Score de Santé & Nutrition</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="healthChart" height="250"></canvas>
                    </div>
                </div>

                <div class="card glass border-green">
                    <div class="card-header">
                        <h3><i class='bx bxs-check-shield text-green'></i> Statut CMU</h3>
                    </div>
                    <div class="card-body text-center">
                        <div class="cmu-status active">
                            <i class='bx bx-check-circle'></i>
                        </div>
                        <h2 class="mt-2 text-green">Actif</h2>
                        <p class="text-muted">Valide jusqu'au 31 Déc 2026</p>
                        <ul class="cmu-benefits mt-2">
                            <li><i class='bx bx-check'></i> Couverture à 70%</li>
                            <li><i class='bx bx-check'></i> Réseau Pharmaceutique</li>
                        </ul>
                    </div>
                </div>

                <div class="card glass">
                    <div class="card-header">
                        <h3><i class='bx bx-bell'></i> Prochains Rendez-vous</h3>
                    </div>
                    <div class="card-body">
                        <div class="appointment-item">
                            <div class="date-box bg-orange">
                                <span class="day">12</span>
                                <span class="month">Oct</span>
                            </div>
                            <div class="appt-details">
                                <strong>Dr. Koné (Cardiologue)</strong>
                                <span>CHU de Treichville</span>
                            </div>
                        </div>
                        <div class="appointment-item mt-2">
                            <div class="date-box bg-dark">
                                <span class="day">28</span>
                                <span class="month">Oct</span>
                            </div>
                            <div class="appt-details">
                                <strong>Vaccination (Dose 2)</strong>
                                <span>Dispensaire Cocody</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- HEALTH ID TEMPLATE -->
    <template id="tpl-health-id">
        <div class="page id-page animate-fade-in">
            <div class="page-header">
                <h2>ID Santé National (Blockchain)</h2>
                <p class="text-muted">Votre identité numérique infalsifiable.</p>
            </div>

            <div class="id-card-wrapper">
                <div class="id-card national-card">
                    <div class="card-top">
                        <div class="ci-flag"></div>
                        <div class="card-titles">
                            <h4>RÉPUBLIQUE DE CÔTE D'IVOIRE</h4>
                            <p>Ministère de la Santé / ID Médicale</p>
                        </div>
                        <i class='bx bx-pulse text-orange card-logo'></i>
                    </div>
                    <div class="card-mid">
                        <img src="https://ui-avatars.com/api/?name=Kouadio+A.&size=120&background=ccc" class="id-photo"
                            alt="Photo">
                        <div class="id-details">
                            <p class="label">Noms et Prénoms / Name</p>
                            <h4>KOUADIO, AMANI JEAN</h4>

                            <div class="id-row">
                                <div>
                                    <p class="label">Né(e) le / DOB</p>
                                    <p>14/05/1988</p>
                                </div>
                                <div>
                                    <p class="label">Sexe / Sex</p>
                                    <p>M</p>
                                </div>
                                <div>
                                    <p class="label">Groupe Sanguin</p>
                                    <p class="blood-type">O+</p>
                                </div>
                            </div>

                            <p class="label mt-1">Numéro d'Identification Personnel (NIP)</p>
                            <h3 class="nip-number">CI-88-14-00129482</h3>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <div class="qr-code-placeholder">
                            <i class='bx bx-qr'></i>
                        </div>
                        <div class="blockchain-verify">
                            <p><i class='bx bx-link'></i> Verified on Polygon</p>
                            <span class="hash">0x8f4d...3b9a</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card glass mt-4 mx-auto max-w-lg">
                <div class="card-body text-center">
                    <i class='bx bxl-polygon text-2xl text-purple' style="color: #8247E5; font-size: 2rem;"></i>
                    <h3 class="mt-2">Smart Contract Bilingue</h3>
                    <p class="text-sm text-muted mt-1">Ce token soulbound (SBT) prouve votre identité auprès des
                        hôpitaux sans dévoiler votre dossier médical complet. Vos données sont cryptées.</p>
                </div>
            </div>
        </div>
    </template>

    <!-- NUTRITION TEMPLATE -->
    <template id="tpl-nutrition">
        <div class="page nutrition-page animate-fade-in">
            <div class="page-header">
                <h2>Nutri-ID</h2>
                <p class="text-muted">Suivi nutritionnel localisé pour la Côte d'Ivoire.</p>
            </div>

            <div class="grid-layout">
                <div class="card glass">
                    <div class="card-header">
                        <h3>Plat du Jour : Garba</h3>
                    </div>
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
                        class="card-img" alt="Food" style="height: 150px; object-fit: cover;">
                    <div class="card-body">
                        <div class="nutri-bars">
                            <div class="progress-item">
                                <div class="p-label"><span>Protéines (Poisson)</span> <span>45g</span></div>
                                <div class="progress-bar">
                                    <div class="fill bg-orange" style="width: 70%"></div>
                                </div>
                            </div>
                            <div class="progress-item">
                                <div class="p-label"><span>Glucides (Attiéké)</span> <span>80g</span></div>
                                <div class="progress-bar">
                                    <div class="fill bg-green" style="width: 90%"></div>
                                </div>
                            </div>
                            <div class="progress-item">
                                <div class="p-label"><span>Lipides (Huile)</span> <span>30g</span></div>
                                <div class="progress-bar">
                                    <div class="fill text-orange" style="width: 40%; background: #F77F00;"></div>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary w-full mt-2">Log Meal</button>
                    </div>
                </div>

                <div class="card glass span-2">
                    <div class="card-header">
                        <h3>Analyse Alimentaire</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="nutritionMap" height="200"></canvas>
                    </div>
                </div>

                <div class="card glass span-2">
                    <div class="card-header">
                        <h3><i class='bx bx-brain'></i> Assistant IA NutriBot</h3>
                    </div>
                    <div class="card-body">
                        <div id="ai-chat-box" class="chat-container mb-2"
                            style="height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;">
                            <!-- Chat messages injected here -->
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="ai-input" class="search-bar" style="flex: 1;"
                                placeholder="Ex: Que penses-tu du Foutou ?">
                            <button id="ai-send" class="btn btn-primary"><i class='bx bx-send'></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- FIND CARE TEMPLATE -->
    <template id="tpl-find-care">
        <div class="page map-page animate-fade-in">
            <div class="page-header">
                <h2>Trouver un Soin (Hôpitaux & Pharmacies)</h2>
                <p class="text-muted">Recherchez les centres de santé affiliés à la CMU.</p>
            </div>
            <div class="card glass">
                <div class="card-body p-0" style="height: 500px; border-radius: 16px; overflow: hidden;">
                    <div id="care-map" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="js/web3.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
