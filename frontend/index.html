<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri-ID | Santé CI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">

    <!-- Third Party Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js" type="application/javascript"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <!-- Background Elements -->
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>
    <div class="glow-bg glow-3"></div>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="logo-container">
            <div class="logo-icon">
                <i class='bx bx-plus-medical'></i>
            </div>
            <span class="logo-text">Nutri-ID</span>
        </div>

        <ul class="nav-links">
            <li><a href="#home" class="active" data-route="home"><i class='bx bxs-home-smile'></i> <span
                        data-i18n="nav.home">Accueil</span></a></li>
            <li><a href="#dashboard" data-route="dashboard"><i class='bx bxs-dashboard'></i> <span
                        data-i18n="nav.dashboard">Tableau de bord</span></a></li>
            <li><a href="#health-id" data-route="health-id"><i class='bx bx-id-card'></i> <span
                        data-i18n="nav.health_id">ID Santé</span></a></li>
            <li><a href="#records" data-route="records"><i class='bx bx-folder-open'></i> <span
                        data-i18n="nav.records">Dossiers</span></a></li>
            <li><a href="#vaccines" data-route="vaccines"><i class='bx bxs-shield-plus'></i> <span
                        data-i18n="nav.vaccines">Vaccins</span></a></li>
            <li><a href="#find-care" data-route="find-care"><i class='bx bxs-map-pin'></i> <span
                        data-i18n="nav.find_care">Trouver un soin</span></a></li>
            <li><a href="#nutrition" data-route="nutrition"><i class='bx bxs-bowl-hot'></i> <span
                        data-i18n="nav.nutrition">Nutri-ID</span></a></li>
            <li><a href="#teleconsult" data-route="teleconsult"><i class='bx bxs-video'></i> <span
                        data-i18n="nav.teleconsult">Téléconsultation</span></a></li>
            <li><a href="#cmu" data-route="cmu"><i class='bx bxs-check-shield'></i> <span data-i18n="nav.cmu">Couverture
                        CMU</span></a></li>
            <li><a href="#fasting" data-route="fasting"><i class='bx bx-calendar-star'></i> <span
                        data-i18n="nav.fasting">Jeûne & Spiritualité</span></a></li>
            <li><a href="#settings" data-route="settings"><i class='bx bxs-cog'></i> <span
                        data-i18n="nav.settings">Paramètres</span></a></li>
        </ul>

        <div class="bottom-user" style="display: none;">
            <!-- Injected by AuthManager -->
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle"><i class='bx bx-menu'></i></button>
            <div class="search-bar">
                <i class='bx bx-search'></i>
                <input type="text" placeholder="Rechercher..." data-i18n-placeholder="topbar.search">
            </div>

            <div class="topbar-actions">
                <div class="lang-selector">
                    <i class='bx bx-globe'></i>
                    <select id="language-select">
                        <option value="fr">Français</option>
                        <option value="dioula">Dioula</option>
                        <option value="baoule">Baoulé</option>
                        <option value="bete">Bété</option>
                        <option value="agni">Agni</option>
                    </select>
                </div>
                <button class="theme-toggle" id="theme-toggle"><i class='bx bx-sun'></i></button>
                <div class="notification">
                    <i class='bx bxs-bell'></i>
                    <span class="badge">3</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Page Container -->
        <div id="page-container" class="page-container">
            <!-- Pages will be injected securely here via JS -->
        </div>
    </main>

    <!-- Partial Templates (Injected dynamically) -->

    <!-- LOGIN TEMPLATE -->
    <template id="tpl-login">
        <div class="page auth-page animate-fade-in"
            style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
            <div class="card glass" style="width: 100%; max-width: 400px; padding: 2rem;">
                <div class="text-center mb-3">
                    <i class='bx bx-plus-medical text-green' style="font-size: 3rem;"></i>
                    <h2 class="mt-1">Bienvenue sur Nutri-ID</h2>
                    <p class="text-muted">Connectez-vous à votre espace santé</p>
                </div>
                <form id="login-form">
                    <div class="form-group mb-2">
                        <label>Email</label>
                        <input type="email" id="login-email" class="search-bar" style="width: 100%; margin-top: 0.5rem;"
                            required placeholder="votre@email.com">
                    </div>
                    <div class="form-group mb-3">
                        <label>Mot de passe</label>
                        <input type="password" id="login-password" class="search-bar"
                            style="width: 100%; margin-top: 0.5rem;" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Se connecter <i
                            class='bx bx-right-arrow-alt'></i></button>
                </form>
                <p class="text-center mt-3 text-sm">
                    Pas encore de compte ? <a href="#register"
                        style="color: var(--color-orange); font-weight: 600;">Créer mon ID Santé</a>
                </p>
            </div>
        </div>
    </template>

    <!-- REGISTER TEMPLATE -->
    <template id="tpl-register">
        <div class="page auth-page animate-fade-in"
            style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding-bottom: 2rem;">
            <div class="card glass" style="width: 100%; max-width: 450px; padding: 2rem;">
                <div class="text-center mb-3">
                    <div class="ci-flag" style="margin: 0 auto 1rem;"></div>
                    <h2 class="mt-1">Créer mon ID Santé</h2>
                    <p class="text-muted">Rejoignez le réseau national de santé</p>
                </div>
                <form id="register-form">
                    <div class="form-group mb-2">
                        <label>Nom et Prénoms *</label>
                        <input type="text" id="reg-name" class="search-bar" style="width: 100%; margin-top: 0.5rem;"
                            required placeholder="Gnagne, Chrys Elisée">
                    </div>
                    <div class="form-group mb-2">
                        <label>Email *</label>
                        <input type="email" id="reg-email" class="search-bar" style="width: 100%; margin-top: 0.5rem;"
                            required placeholder="votre@email.com">
                    </div>
                    <div class="form-group mb-2">
                        <label>Mot de passe *</label>
                        <input type="password" id="reg-password" class="search-bar"
                            style="width: 100%; margin-top: 0.5rem;" required minlength="6" placeholder="••••••••">
                    </div>
                    <div class="id-row mt-2 mb-3">
                        <div>
                            <label class="text-sm">NIP (Optionnel)</label>
                            <input type="text" id="reg-nip" class="search-bar" style="width: 100%; margin-top: 0.5rem;"
                                placeholder="CI-...">
                        </div>
                        <div>
                            <label class="text-sm">Groupe Sanguin</label>
                            <select id="reg-blood" class="search-bar"
                                style="width: 100%; margin-top: 0.5rem; background: rgba(0,0,0,0.2);">
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-full bg-orange">Créer mon compte <i
                            class='bx bx-right-arrow-alt'></i></button>
                </form>
                <p class="text-center mt-3 text-sm">
                    Déjà inscrit ? <a href="#login" style="color: var(--color-green); font-weight: 600;">Se
                        connecter</a>
                </p>
            </div>
        </div>
    </template>

    <!-- HOME TEMPLATE -->
    <template id="tpl-home">
        <div class="page hero-page animate-fade-in">
            <div class="hero-content">
                <div class="badge-pill mb-2">
                    <span class="dot"></span> <span data-i18n="home.live_status">Système National Sécurisé</span>
                </div>
                <h1 class="hero-title"><span class="gradient-text">Santé & Nutrition</span><br>Pour Toute la Côte
                    d'Ivoire</h1>
                <p class="hero-subtitle" data-i18n="home.subtitle">Votre identité de santé sécurisée par la blockchain,
                    accessible partout, à tout moment. Ministère de la Santé CI.</p>
                <div class="hero-actions">
                    <a href="#dashboard" class="btn btn-primary"><span data-i18n="home.btn_dashboard">Accéder au Tableau
                            de Bord</span> <i class='bx bx-right-arrow-alt'></i></a>
                    <a href="#health-id" class="btn btn-secondary"><span data-i18n="home.btn_id">Voir mon ID
                            Santé</span></a>
                </div>
            </div>
            <div class="stats-row mt-4">
                <div class="stat-card glass">
                    <i class='bx bx-user-check text-orange'></i>
                    <div class="stat-info">
                        <h3>2.4M</h3>
                        <p>Citoyens Connectés</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <i class='bx bx-buildings text-green'></i>
                    <div class="stat-info">
                        <h3>840+</h3>
                        <p>Centres de Santé</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <i class='bx bx-link-external text-white'></i>
                    <div class="stat-info">
                        <h3>100%</h3>
                        <p>Blockchain Sécurisée</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD TEMPLATE -->
    <template id="tpl-dashboard">
        <div class="page dashboard-page animate-fade-in">
            <div class="page-header">
                <div>
                    <h2 data-i18n="dashboard.title">Tableau de bord</h2>
                    <p class="text-muted" data-i18n="dashboard.subtitle">Aperçu de votre état de santé et assurance.</p>
                </div>
                <a href="#records" class="btn btn-primary btn-sm"><i class='bx bx-plus'></i> <span
                        data-i18n="dashboard.new_record">Nouveau Document</span></a>
            </div>

            <!-- Stat strip -->
            <div class="stats-row mb-3" id="dash-stats-row">
                <div class="stat-card glass">
                    <i class='bx bx-folder-open text-orange'></i>
                    <div class="stat-info">
                        <h3 id="dash-record-count">—</h3>
                        <p>Dossiers médicaux</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <i class='bx bxs-bowl-hot text-green'></i>
                    <div class="stat-info">
                        <h3 id="dash-kcal-today">—</h3>
                        <p>kcal aujourd'hui</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <i class='bx bxs-check-shield text-green'></i>
                    <div class="stat-info">
                        <h3 id="dash-cmu-badge">—</h3>
                        <p>Statut CMU</p>
                    </div>
                </div>
            </div>

            <div class="grid-layout">
                <div class="card glass span-2">
                    <div class="card-header">
                        <h3><i class='bx bx-activity'></i> Score de Santé & Nutrition</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="healthChart" height="250"></canvas>
                    </div>
                </div>

                <div class="card glass border-green">
                    <div class="card-header">
                        <h3><i class='bx bxs-check-shield text-green'></i> Statut CMU</h3>
                    </div>
                    <div class="card-body text-center">
                        <div id="dash-cmu-icon" class="cmu-status active">
                            <i class='bx bx-loader-alt bx-spin'></i>
                        </div>
                        <h2 id="dash-cmu-label" class="mt-2">—</h2>
                        <p class="text-muted" id="dash-cmu-sub">Chargement...</p>
                        <ul class="cmu-benefits mt-2">
                            <li><i class='bx bx-check'></i> Couverture à 70%</li>
                            <li><i class='bx bx-check'></i> Réseau Pharmaceutique</li>
                        </ul>
                    </div>
                </div>

                <div class="card glass">
                    <div class="card-header">
                        <h3><i class='bx bxs-bowl-hot text-orange'></i> Dernier repas</h3>
                    </div>
                    <div class="card-body">
                        <div id="dash-last-meal" class="text-center" style="padding: 1rem 0;">
                            <i class='bx bx-loader-alt bx-spin' style="font-size:1.5rem;"></i>
                        </div>
                        <div class="mt-3 text-center">
                            <a href="#nutrition" class="btn btn-secondary btn-sm">
                                <i class='bx bx-plus'></i> Logger un repas
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- HEALTH ID TEMPLATE -->
    <template id="tpl-health-id">
        <div class="page id-page animate-fade-in">
            <div class="page-header">
                <h2>ID Santé National (Blockchain)</h2>
                <p class="text-muted">Votre identité numérique infalsifiable.</p>
            </div>

            <!-- Wallet Connect Bar -->
            <div class="wallet-bar glass mb-3">
                <div class="wallet-bar-left">
                    <span id="wallet-status" class="wallet-status">
                        <i class='bx bxs-wallet'></i> Non connecté
                    </span>
                    <span id="network-status" style="margin-left:1rem;"></span>
                </div>
                <button id="connect-wallet-btn" class="btn btn-primary btn-sm">
                    <i class='bx bx-wallet-alt'></i> Connecter mon Portefeuille
                </button>
            </div>

            <!-- SBT Verification Badge -->
            <div id="sbt-verification" class="sbt-badge-wrapper mb-3"></div>

            <!-- Mint / Check SBT Zone -->
            <div id="mint-zone" class="card glass mb-4" style="max-width:640px;">
                <div class="card-header">
                    <h3><i class='bxl-polygon' style="color:#8247E5"></i> SBT Health ID — Polygon</h3>
                </div>
                <div class="card-body">
                    <p class="text-sm text-muted mb-3">Vérifiez si votre adresse Polygon possède déjà un ID Santé
                        SBT, ou mintez-en un nouveau.</p>
                    <div class="form-group mb-3">
                        <label class="text-sm">Adresse Portefeuille Polygon (0x…)</label>
                        <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                            <input type="text" id="mint-wallet-addr" class="search-bar"
                                style="flex:1;font-family:monospace;font-size:0.85rem;" placeholder="0x...">
                            <button id="mint-use-metamask-btn" class="btn btn-secondary btn-sm"
                                title="Utiliser l'adresse MetaMask connectée">
                                <i class='bx bxl-metamask'></i>
                            </button>
                        </div>
                    </div>
                    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                        <button id="mint-check-btn" class="btn btn-secondary btn-sm">
                            <i class='bx bx-search'></i> Vérifier statut
                        </button>
                        <button id="mint-btn" class="btn btn-primary btn-sm" style="display:none;">
                            <i class='bxl-polygon'></i> Minter mon ID Santé SBT
                        </button>
                    </div>
                    <div id="mint-result" class="mt-3 text-sm"
                        style="display:none;padding:0.75rem;border-radius:8px;background:rgba(0,0,0,0.15);"></div>
                </div>
            </div>

            <!-- Health ID Card -->
            <div class="id-card-wrapper">
                <div class="id-card national-card">
                    <div class="card-top">
                        <div class="ci-flag"></div>
                        <div class="card-titles">
                            <h4>RÉPUBLIQUE DE CÔTE D'IVOIRE</h4>
                            <p>Ministère de la Santé / ID Médicale</p>
                        </div>
                        <i class='bx bx-pulse text-orange card-logo'></i>
                    </div>
                    <div class="card-mid">
                        <img id="hid-photo" src="https://ui-avatars.com/api/?name=Gnagne+C.&size=120&background=ccc"
                            class="id-photo" alt="Photo">
                        <div class="id-details">
                            <p class="label">Noms et Prénoms / Name</p>
                            <h4 id="hid-name">GNAGNE, CHRYS ELISÉE</h4>

                            <div class="id-row">
                                <div>
                                    <p class="label">Né(e) le / DOB</p>
                                    <p id="hid-dob">14/05/1988</p>
                                </div>
                                <div>
                                    <p class="label">Sexe / Sex</p>
                                    <p id="hid-sex">M</p>
                                </div>
                                <div>
                                    <p class="label">Groupe Sanguin</p>
                                    <!-- Live: populated by web3.js -->
                                    <p class="blood-type" id="hid-blood-type">O+</p>
                                </div>
                            </div>

                            <p class="label mt-1">Numéro d'Identification Personnel (NIP)</p>
                            <!-- Live: hash from blockchain -->
                            <h3 class="nip-number" id="hid-nip" title="Valeur chiffrée sur la blockchain">
                                CI-88-14-00129482</h3>

                            <div class="id-row mt-1">
                                <div>
                                    <p class="label">CMU</p>
                                    <p id="hid-cmu-status" class="text-green">Actif ✓</p>
                                </div>
                                <div>
                                    <p class="label">Émis le</p>
                                    <p id="hid-issued-at">—</p>
                                </div>
                                <div>
                                    <p class="label">Token ID</p>
                                    <p id="hid-token-id" style="color:#8247E5;font-weight:600;">—</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <div class="qr-code-placeholder" id="qr-container">
                            <i class='bx bx-qr'></i>
                        </div>
                        <div class="blockchain-verify">
                            <p><i class='bx bx-link'></i> Secured on Polygon</p>
                            <span class="hash" id="hid-wallet-short">0x????...????</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Info Card -->
            <div class="card glass mt-4" style="max-width:520px;margin:1rem auto 0;">
                <div class="card-body text-center">
                    <i class='bx bxl-polygon' style="color:#8247E5;font-size:2rem;"></i>
                    <h3 class="mt-2">Soulbound Token (SBT) — ERC-721</h3>
                    <p class="text-sm text-muted mt-1">Ce token est non-transférable et prouve votre identité auprès des
                        hôpitaux partenaires sans dévoiler l'intégralité de votre dossier. Vos données NIP sont
                        cryptées.</p>
                </div>
            </div>
        </div>
    </template>

    <!-- NUTRITION TEMPLATE -->
    <template id="tpl-nutrition">
        <div class="page nutrition-page animate-fade-in">
            <div class="page-header">
                <h2>Nutri-ID</h2>
                <p class="text-muted">Suivi nutritionnel localisé pour la Côte d'Ivoire.</p>
            </div>

            <div class="grid-layout">

                <!-- Meal Log Form -->
                <div class="card glass">
                    <div class="card-header">
                        <h3><i class='bx bx-plus-circle text-orange'></i> Enregistrer un repas</h3>
                    </div>
                    <div class="card-body">
                        <form id="meal-log-form">
                            <div class="form-group mb-2">
                                <label class="text-sm">Nom du repas</label>
                                <input type="text" id="meal-name" class="search-bar"
                                    style="width:100%;margin-top:0.5rem;"
                                    placeholder="Ex: Garba, Foutou banane, Riz sauce graine" required>
                            </div>
                            <div class="id-row mt-2 mb-2">
                                <div>
                                    <label class="text-sm">Protéines (g)</label>
                                    <input type="number" id="meal-proteins" class="search-bar"
                                        style="width:100%;margin-top:0.4rem;" min="0" step="0.1" placeholder="0"
                                        required>
                                </div>
                                <div>
                                    <label class="text-sm">Glucides (g)</label>
                                    <input type="number" id="meal-carbs" class="search-bar"
                                        style="width:100%;margin-top:0.4rem;" min="0" step="0.1" placeholder="0"
                                        required>
                                </div>
                                <div>
                                    <label class="text-sm">Lipides (g)</label>
                                    <input type="number" id="meal-fats" class="search-bar"
                                        style="width:100%;margin-top:0.4rem;" min="0" step="0.1" placeholder="0"
                                        required>
                                </div>
                            </div>
                            <div id="meal-calories-preview" class="text-center text-sm text-muted mb-2"
                                style="min-height:1.4rem;"></div>
                            <button type="submit" id="meal-submit-btn" class="btn btn-primary w-full">
                                <i class='bx bx-save'></i> Enregistrer
                            </button>
                            <div id="meal-log-msg" class="mt-2 text-center text-sm" style="display:none;"></div>
                        </form>
                    </div>
                </div>

                <!-- Today's Summary -->
                <div class="card glass border-green">
                    <div class="card-header">
                        <h3><i class='bx bx-bar-chart-alt-2 text-green'></i> Aujourd'hui</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <h2 id="today-calories" class="text-orange" style="font-size:2.5rem;font-weight:700;">—</h2>
                            <p class="text-muted text-sm">kcal aujourd'hui</p>
                        </div>
                        <div class="nutri-bars">
                            <div class="progress-item">
                                <div class="p-label"><span>Protéines</span> <span id="today-proteins">—</span></div>
                                <div class="progress-bar">
                                    <div id="bar-proteins" class="fill bg-orange" style="width:0%"></div>
                                </div>
                            </div>
                            <div class="progress-item">
                                <div class="p-label"><span>Glucides</span> <span id="today-carbs">—</span></div>
                                <div class="progress-bar">
                                    <div id="bar-carbs" class="fill bg-green" style="width:0%"></div>
                                </div>
                            </div>
                            <div class="progress-item">
                                <div class="p-label"><span>Lipides</span> <span id="today-fats">—</span></div>
                                <div class="progress-bar">
                                    <div id="bar-fats" class="fill" style="width:0%;background:#F77F00;"></div>

    <template id="tpl-cmu">
        <div class="page cmu-page animate-fade-in">
            <div class="page-header">
                <h2><i class='bx bxs-check-shield text-green'></i> Couverture Maladie Universelle (CMU)</h2>
                <p class="text-muted">Votre statut d'assurance maladie nationale.</p>
            </div>

            <div class="grid-layout">
                <!-- Status Card -->
                <div class="card glass border-green" style="text-align:center;">
                    <div class="card-body" style="padding:2rem;">
                        <div id="cmu-icon" style="font-size:4rem;margin-bottom:1rem;">
                            <i class='bx bx-loader-alt bx-spin text-muted'></i>
                        </div>
                        <h2 id="cmu-status-label" style="font-size:2rem;font-weight:700;">—</h2>
                        <p id="cmu-status-sub" class="text-muted mt-1">Chargement du statut...</p>
                        <div id="cmu-user-info" class="mt-3" style="display:none;">
                            <p class="text-sm"><strong id="cmu-name">—</strong></p>
                            <p class="text-sm text-muted" id="cmu-blood">—</p>
                        </div>
                    </div>
                </div>

                <!-- Benefits Card -->
                <div class="card glass span-2">
                    <div class="card-header">
                        <h3><i class='bx bx-gift text-orange'></i> Services couverts par la CMU</h3>
                    </div>
                    <div class="card-body">
                        <div class="grid-layout" style="gap:1rem;">
                            <div class="card glass" style="padding:1rem;">
                                <i class='bx bx-plus-medical text-green' style="font-size:1.8rem;"></i>
                                <h4 class="mt-1">Consultations</h4>
                                <p class="text-sm text-muted">Médecine générale et spécialisée dans les centres affiliés
                                    CMU.</p>
                            </div>
                            <div class="card glass" style="padding:1rem;">
                                <i class='bx bx-capsule text-orange' style="font-size:1.8rem;"></i>
                                <h4 class="mt-1">Médicaments</h4>
                                <p class="text-sm text-muted">Remboursement partiel sur la liste nationale des
                                    médicaments essentiels.</p>
                            </div>
                            <div class="card glass" style="padding:1rem;">
                                <i class='bx bx-test-tube text-green' style="font-size:1.8rem;"></i>
                                <h4 class="mt-1">Examens</h4>
                                <p class="text-sm text-muted">Analyses biologiques et imagerie médicale de base.</p>
                            </div>
                            <div class="card glass" style="padding:1rem;">
                                <i class='bx bx-heart text-orange' style="font-size:1.8rem;"></i>
                                <h4 class="mt-1">Maternité</h4>
                                <p class="text-sm text-muted">Suivi de grossesse, accouchement et soins post-nataux.</p>
                            </div>
                            <div class="card glass" style="padding:1rem;">
                                <i class='bx bxs-shield-plus text-green' style="font-size:1.8rem;"></i>
                                <h4 class="mt-1">Vaccinations</h4>
                                <p class="text-sm text-muted">Programme élargi de vaccination (PEV) et vaccins
                                    recommandés.</p>
                            </div>
                            <div class="card glass" style="padding:1rem;">
                                <i class='bx bx-bed text-orange' style="font-size:1.8rem;"></i>
                                <h4 class="mt-1">Hospitalisation</h4>
                                <p class="text-sm text-muted">Prise en charge partielle des frais d'hospitalisation
                                    d'urgence.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Info footer -->
                <div class="card glass span-3"
                    style="background:rgba(0,154,68,0.08);border:1px solid rgba(0,154,68,0.3);">
                    <div class="card-body" style="display:flex;align-items:center;gap:1rem;">
                        <i class='bx bx-info-circle text-green' style="font-size:2rem;flex-shrink:0;"></i>
                        <p class="text-sm text-muted">La CMU est gérée par la <strong>Caisse Nationale d'Assurance
                                Maladie (CNAM-CI)</strong>. Pour toute question, contactez le <strong>0800 888
                                99</strong> (numéro gratuit) ou rendez-vous dans un centre CNAM agréé.</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- TELECONSULTATION TEMPLATE -->
    <template id="tpl-teleconsult">
        <div class="page teleconsult-page animate-fade-in">
            <div class="page-header">
                <h2><i class='bx bxs-video text-orange'></i> Téléconsultation</h2>
                <p class="text-muted">Consultez un médecin à distance, depuis chez vous.</p>
            </div>

            <div class="grid-layout">
                <!-- Booking Form -->
                <div class="card glass">
                    <div class="card-header">
                        <h3><i class='bx bx-calendar-plus text-orange'></i> Demander une consultation</h3>
                    </div>
                    <div class="card-body">
                        <form id="teleconsult-form">
                            <div class="form-group mb-2">
                                <label class="text-sm">Date et heure souhaitées</label>
                                <input type="datetime-local" id="tc-scheduled-at" class="search-bar"
                                    style="width:100%;margin-top:0.5rem;" required>
                            </div>
                            <div class="form-group mb-3">
                                <label class="text-sm">Motif de consultation</label>
                                <textarea id="tc-notes" class="search-bar"
                                    style="width:100%;margin-top:0.5rem;height:80px;resize:vertical;"
                                    placeholder="Décrivez brièvement vos symptômes ou la raison de la consultation..."></textarea>
                            </div>
                            <button type="submit" id="tc-submit-btn" class="btn btn-primary w-full">
                                <i class='bx bx-send'></i> Envoyer la demande
                            </button>
                            <div id="tc-msg" class="mt-2 text-center text-sm" style="display:none;"></div>
                        </form>
                    </div>
                </div>

                <!-- Upcoming consultations -->
                <div class="card glass span-2">
                    <div class="card-header">
                        <h3><i class='bx bx-list-ul'></i> Mes consultations</h3>
                    </div>
                    <div class="card-body">
                        <div id="tc-loading" class="text-center text-muted" style="display:none;padding:1rem 0;">
                            <i class='bx bx-loader-alt bx-spin' style="font-size:1.5rem;"></i>
                        </div>
                        <div id="tc-empty" class="text-center text-muted" style="display:none;padding:2rem 0;">
                            <i class='bx bxs-video' style="font-size:2.5rem;"></i>
                            <p class="mt-1 text-sm">Aucune consultation planifiée. Faites votre première demande !</p>
                        </div>
                        <div id="tc-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="js/ai.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ipfs.js"></script>
    <script src="js/app.js"></script>
</body>
