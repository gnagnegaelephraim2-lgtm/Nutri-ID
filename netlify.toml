# =============================================================================
# Netlify — Nutri-ID Frontend Deployment Config
# =============================================================================

[build]
  # Frontend source is in the frontend/ subdirectory
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_API_URL must be set in Netlify Dashboard → Site → Environment Variables
  # Value: your Railway backend URL e.g. https://nutriid-backend.up.railway.app

# ── SPA Fallback — all routes served by index.html (React Router) ─────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(self)"
