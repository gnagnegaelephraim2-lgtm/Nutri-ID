app = "nutri-id-api"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  RUST_LOG = "info"
  RUST_ENV = "production"
  DATABASE_URL = "sqlite:/app/data/nutriid.db?mode=rwc"
  POLYGON_RPC_URL = "https://rpc-amoy.polygon.technology"
  POLYGON_CHAIN_ID = "80002"
  ALLOWED_ORIGIN = "https://nutri-id-app.fly.dev"

[[mounts]]
  source = "nutriid_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
