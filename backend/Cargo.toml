[package]
name = "nutriid-backend"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "macros"] }
jsonwebtoken = "9.2"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
# getrandom: forced to rdrand backend (pure Rust x86 CPU instruction, no C/linker needed)
getrandom = { version = "0.2", features = ["rdrand"] }
# Keccak256 for ABI function selector encoding (pure Rust, no C dependencies)
sha3 = "0.10"
# secp256k1 ECDSA for Ethereum transaction signing (pure Rust)
k256 = { version = "0.13", features = ["ecdsa"] }
# Password hashing
bcrypt = "0.15"
# HTTP client for Claude API calls (server-side, API key never exposed to browser)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }


