worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ----------------------------------------------------------------------
    # Security Headers (applied globally)
    # ----------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.pinata.cloud https://gateway.pinata.cloud https://*.alchemyapi.io wss: ws:;" always;

    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    # Rate Limiting — protect the API from abuse
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream definition for the Rust/Axum backend
    upstream nutriid_backend {
        server backend:3000;
        keepalive 32;
    }

    # ----------------------------------------------------------------------
    # HTTP Server — Redirect all HTTP traffic to HTTPS
    # ----------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge (for Let's Encrypt SSL certificate renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------------------
    # HTTPS Server — Main production server
    # ----------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name nutriid.ci www.nutriid.ci;

        # SSL Certificate (managed by Certbot / Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/nutriid.ci/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nutriid.ci/privkey.pem;

        # SSL Security Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — Force HTTPS for 1 year (including subdomains)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Connection limits
        limit_conn conn_limit 20;

        # ----------------------------------------------------------------------
        # Frontend — Serve the static SPA directly from Nginx
        # ----------------------------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        # Long-lived cache for immutable assets (JS, CSS files with content hashes)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # API Proxy — Forward /api/* to the Rust/Axum backend
        # ----------------------------------------------------------------------
        location /api/ {
            # Rate limiting for API endpoints
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://nutriid_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Block hidden files (except .well-known)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
