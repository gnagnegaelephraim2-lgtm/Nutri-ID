version: '3.8'

services:
  # ───────────────────────────────────────────────
  # Backend — Rust / Axum API Server (SQLite)
  # ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=sqlite:/app/data/nutriid.db?mode=rwc
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://nutriid.ci}
      - RUST_ENV=${RUST_ENV:-production}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-https://rpc-amoy.polygon.technology}
      - POLYGON_CHAIN_ID=${POLYGON_CHAIN_ID:-80002}
      - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
      - HEALTH_ID_CONTRACT_ADDRESS=${HEALTH_ID_CONTRACT_ADDRESS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - sqlite-data:/app/data
    networks:
      - nutriid-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ───────────────────────────────────────────────
  # Nginx — Reverse Proxy + SSL Termination + Frontend Static Serving
  # ───────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Frontend static files served directly by Nginx (Vite build output)
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Let's Encrypt SSL certificates (managed by Certbot)
      - certbot-certs:/etc/letsencrypt:ro
      # Certbot webroot for ACME challenge
      - certbot-webroot:/var/www/certbot:ro
      # Nginx logs
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nutriid-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ───────────────────────────────────────────────
  # Certbot — Automatic SSL Certificate Renewal
  # ───────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renew certificates every 12 hours, reload Nginx on renewal
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    depends_on:
      - nginx

volumes:
  sqlite-data:
  certbot-certs:
  certbot-webroot:
  nginx-logs:


networks:
  nutriid-net:
    driver: bridge
